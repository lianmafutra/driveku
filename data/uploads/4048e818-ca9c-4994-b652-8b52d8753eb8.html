<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>App Login</title>

    <!-- Google Font: Source Sans Pro -->
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://streaming.radiosalamjambi.com/plugins/fontawesome-free/css/all.min.css">
  <!-- Ionicons -->
  

  <!-- Theme style -->
  <link rel="stylesheet" href="https://streaming.radiosalamjambi.com/dist/css/adminlte.min.css">

  <!-- overlayScrollbars -->
  <link rel="stylesheet" href="https://streaming.radiosalamjambi.com/plugins/overlayScrollbars/css/OverlayScrollbars.min.css">
  <link rel="stylesheet" href="https://streaming.radiosalamjambi.com/plugins/sweetalert2-theme-bootstrap-4/bootstrap-4.min.css">
  <link rel="stylesheet" href="https://streaming.radiosalamjambi.com/plugins/select2/css/select2.min.css ">
  <link rel="stylesheet" href="https://streaming.radiosalamjambi.com/plugins/select2-bootstrap4-theme/select2-bootstrap4.min.css">

    <style>
        body {
            color: #999;
         
            font-family: 'Varela Round', sans-serif;
        }

        .form-control {
            box-shadow: none;
            border-color: #ddd;
        }

        .form-control:focus {
            border-color: #4d50dd ;
        }

        .login-form {
            width: 350px;
            margin-top: 50px;
            padding: 30px 0;
        }

        .login-form form {
            color: #434343;
            border-radius: 1px;
            margin-bottom: 15px;
            background: #fff;
            border: 1px solid #f3f3f3;
            box-shadow: 0px 2px 2px rgba(0, 0, 0, 0.3);
            padding: 30px;
        }

        .login-form h4 {
            text-align: center;
            font-size: 22px;
            margin-bottom: 20px;
        }

        .login-form .avatar {
            color: #fff;
            margin: 0 auto 30px;
            text-align: center;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            z-index: 9;
            background: #4d50dd ;
            padding: 15px;
            box-shadow: 0px 2px 2px rgba(0, 0, 0, 0.1);
        }

        .login-form .avatar i {
            font-size: 62px;
        }

        .login-form .form-group {
            margin-bottom: 20px;
        }

        .login-form .form-control,
        .login-form .btn {
            min-height: 40px;
            border-radius: 2px;
            transition: all 0.5s;
        }

        .login-form .close {
            position: absolute;
            top: 15px;
            right: 15px;
        }

        .login-form .btn {
            background: #4d50dd ;
            border: none;
            line-height: normal;
        }

        .login-form .btn:hover,
        .login-form .btn:focus {
            background: #4d50dd ;
        }

        .login-form .checkbox-inline {
            float: left;
        }

        .login-form input[type="checkbox"] {
            margin-top: 2px;
        }

        .login-form .forgot-link {
            float: right;
        }

        .login-form .small {
            font-size: 13px;
        }

        .login-form a {
            color: #4d50dd ;
        }

    </style>
</head>

<body class="hold-transition login-page " style="   background-color: #2f318b;">
    

    <div class="login-form">
        <form method="POST" action="https://streaming.radiosalamjambi.com/action-login">
            <input type="hidden" name="_token" value="Q1j7Xzanx2GWkVWXlv9oUfmAxe2TPaQeb3Ytvt6Z">          
            
            <img width="300px" src="https://streaming.radiosalamjambi.com/dist/img/logo.png">
                        <div class="form-group">
                <input id="username" type="text" value="" name="username"
                    class="form-control " placeholder="Username" required
                    autofocus>

            </div>
            <div class="form-group">
                <input id="password" type="password" class="form-control "
                    name="password" required autocomplete="current-password" placeholder="Password">
                            </div>
            <div class="form-group small clearfix">

            </div>
            <input type="submit" class="btn btn-primary btn-block btn-lg" value="Login">
        </form>
        <div class="text-center small">Developed By NextDev</div>
    </div>
    </div>


    <!-- jQuery -->
<script src="https://streaming.radiosalamjambi.com/plugins/jquery/jquery.min.js"></script>
<!-- jQuery UI 1.11.4 -->
<script src="https://streaming.radiosalamjambi.com/plugins/jquery-ui/jquery-ui.min.js"></script>
<!-- Resolve conflict in jQuery UI tooltip with Bootstrap tooltip -->
<script>
  $.widget.bridge('uibutton', $.ui.button)
</script>
<!-- Bootstrap 4 -->
<script src="https://streaming.radiosalamjambi.com/plugins/bootstrap/js/bootstrap.bundle.min.js"></script>

<!-- overlayScrollbars -->
<script src="https://streaming.radiosalamjambi.com/plugins/overlayScrollbars/js/jquery.overlayScrollbars.min.js"></script>

<!-- AdminLTE App -->
<script src="https://streaming.radiosalamjambi.com/dist/js/adminlte.js"></script>
<script src="https://streaming.radiosalamjambi.com/plugins/sweetalert2/sweetalert2.min.js"></script>
<script src="https://streaming.radiosalamjambi.com/plugins/select2/js/select2.full.min.js"></script> 
    <script>
        $('#username').click(function() {
            $(".error-login").fadeOut(300);
        });
        $("#username").on("input", function(){
            $(".error-login").fadeOut(300);
        });
        $("#password").on("input", function(){
            $(".error-login").fadeOut(300);
        });
      
    </script>
</body>

</html>
